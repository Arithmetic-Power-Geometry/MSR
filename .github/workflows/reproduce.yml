name: Reproduce MSR Results
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install exact reproducibility environment
        run: python -m pip install -r requirements-lock.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Reproduce all experiments
        run: python run_all.py
      - name: Smoke-test interactive app
        run: python -c "import app; print('app import ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: msr-results
          path: results/
